# Chronicle Ayu Evolve Theme
# Based on helix-editor's ayu_evolve theme
# Author: gibbz00

[palette]
background = "#020202"
black = "#0D0D0D"
dark_gray = "#2d3640"
gray = "#5c6773"
light_gray = "#dedede"
foreground = "#bfbdb6"
blue = "#59c2ff"
cyan = "#73b8ff"
green = "#aad94c"
magenta = "#d2a6ff"
orange = "#ff8f40"
yellow = "#e6b450"
light_yellow = "#cfca0d"
red = "#f07178"
light_red = "#dd3e25"
vibrant_orange = "#ff8732"
vibrant_yellow = "#cfca0d"

[ui.background]
bg = "background"

[ui.surface]
bg = "black"

[ui.text.primary]
fg = "foreground"

[ui.text.secondary]
fg = "gray"

[ui.text.muted]
fg = "dark_gray"

[ui.selection]
bg = "dark_gray"
fg = "foreground"

[ui.selection.active]
fg = "black"
bg = "orange"

[ui.border.normal]
fg = "dark_gray"

[ui.border.focused]
fg = "orange"

[ui.sidebar.header]
fg = "gray"

[ui.sidebar.item]
fg = "foreground"

[ui.sidebar.selected]
fg = "black"
bg = "orange"
modifiers = ["bold"]

[ui.sidebar.create_action]
fg = "cyan"
modifiers = ["italic"]

[ui.status]
normal = "blue"
command = "orange"
input = "green"
select = "magenta"
review = "magenta"
hierarchical_selection = "cyan"
planning_preview = "blue"
task_detail_wizard = "yellow"
current_plan_navigation = "cyan"
theme_selection = "cyan"

[ui.content.title]
fg = "orange"
modifiers = ["bold"]

[ui.content.header]
fg = "foreground"
modifiers = ["bold"]

[ui.content.table_header]
fg = "orange"

[ui.content.table_border]
fg = "dark_gray"

[ui.wizard.field_label]
fg = "foreground"
modifiers = ["bold"]

[ui.wizard.field_value]
fg = "foreground"

[ui.wizard.field_value_empty]
fg = "gray"

[ui.wizard.field_value_auto]
fg = "gray"

[ui.wizard.button_confirm]
fg = "black"
bg = "green"
modifiers = ["bold"]

[ui.wizard.button_cancel]
fg = "gray"

[ui.wizard.button_selected]
fg = "black"
bg = "orange"

[ui.command.input]
fg = "foreground"
bg = "black"

[ui.command.result]
fg = "foreground"
bg = "black"

[ui.command.result_selected]
fg = "black"
bg = "orange"
modifiers = ["bold"]
